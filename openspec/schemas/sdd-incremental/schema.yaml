name: sdd-incremental
version: 1
description: >-
  Spec-driven workflow with impact analysis and supervised incremental TDD
  (OpenSpec + incremental TDD) - impact → proposal → specs → design → tasks → one
  reviewed TDD cycle at a time
artifacts:
  - id: impact
    generates: impact.md
    description: Impact analysis of the change against the current approved specs
    template: impact.md
    instruction: |
      Create a SHORT impact analysis BEFORE proposing anything. Its job is to
      protect the existing business rules, not to design the change.

      Research first:
      - Run `openspec list --specs` for the capability inventory, then
        `openspec show "<spec-id>" --type spec` for every capability that could
        be affected. Append `--store "<id>"` only for a registered standalone store.
      - The CURRENT approved rules live in `openspec/specs/`. Treat only those as
        binding.
      - `openspec/changes/archive/` is history. Read it only to understand WHY a
        past decision was made. Never treat an archived requirement as a current
        rule: it may have been modified or removed later.
      - Read the code to locate what the change touches and where existing rules
        are enforced. Never infer new rules from the code.

      Sections (bullets, one line each, cite the requirement as
      `<capability-path>` → "<Requirement name>"):
      - **Requisitos afectados**: existing requirements this change touches.
      - **Posibles conflictos**: where the requested behavior contradicts or
        bends an existing rule. If there are more than 3, list only the 3 most
        important and say how many remain; we discuss them in parts.
      - **Reglas que deben seguir cumpliéndose**: existing rules that must keep
        holding after the change. Each one becomes a regression test candidate
        in tasks.md.
      - **Código / componentes / API / servicios afectados**: what the change
        will touch, with paths or names (modules, components, endpoints,
        services, tables, external integrations) and one line on why. This is
        the only artifact before design.md that names code; the proposal stays
        functional.
      - **Preguntas para decidir**: decisions that belong to the human. One
        question per bullet, each with your suggested answer.

      Rules:
      - Do not invent requirements. Missing information becomes a question,
        never an assumption.
      - Do not propose solutions, design or tasks here.
      - If there are no specs yet (new project), say so in one line and keep
        only "Código / componentes / API / servicios afectados" and
        "Preguntas para decidir".
      - Keep it under one page. If the user has not answered the blocking
        questions, stop after writing this artifact and ask them.
    requires: []

  - id: proposal
    generates: proposal.md
    description: Functional scope of the change (title "Alcance")
    template: proposal.md
    instruction: |
      Write the functional scope of the change: what the system will and will
      not do for its users, and why. Nothing about how it is built.

      Sections (exact Spanish headings from the template):
      - **Motivo**: 1-2 sentences. The problem or opportunity, and why now.
      - **Objetivos**: what the system will do after this change, one
        observable behavior per bullet. Mark behavior that breaks existing
        expectations with **INCOMPATIBLE**.
      - **No objetivos**: related behavior explicitly left out, one per bullet,
        so it does not sneak into specs or code. Omit the section if there is
        nothing worth excluding.
      - **Funcionalidades**: the contract with the specs phase. Each
        funcionalidad is an OpenSpec capability (one spec folder).
        - **Nuevas**: each becomes `specs/<capability-path>/spec.md`. Name it for
          a durable business behavior (`gestion-reservas`), not for this work
          (`anadir-boton-reserva`). Kebab-case; follow the project's existing
          spec organization.
        - **Modificadas**: existing capabilities whose REQUIREMENTS change, using
          the exact path under `openspec/specs/`. Each needs a delta spec.
        Omit an empty subsection.

      Functional only:
      - Never mention variables, functions, classes, files, tables, endpoints,
        libraries or frameworks. Affected code, components, APIs and services
        belong in impact.md; technical decisions belong in design.md.
      - Write in business terms the user would recognize.

      Concise and unambiguous - it must read in under a minute:
      - One line per bullet. No introductions, no summaries, no filler.
      - Never repeat between sections, and never restate impact.md: if a point
        is already in Motivo, it does not reappear in Objetivos.
      - Use concrete, verifiable words ("una operación cancelada libera sus
        recursos"), not vague ones ("mejorar la gestión de recursos").
      - If a bullet cannot be made unambiguous without a decision from the user,
        ask instead of writing it.

      Before filling in Funcionalidades, research existing specs: run
      `openspec list --specs` for the capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for related
      ones, and read each relevant spec in full with
      `openspec show "<spec-id>" --type spec`. Append `--store "<id>"` only for
      a registered standalone store, and keep `--type spec` (a change and a
      spec sharing a name is otherwise ambiguous). Reuse an existing
      capability's exact path instead of a near-duplicate name.

      Every change must declare at least one capability, or set
      `skip_specs: true` in the change's `.openspec.yaml` when no spec-level
      behavior changes (pure refactor, tooling, docs) - `openspec validate`
      rejects a zero-delta change otherwise. Do not invent a requirement just
      to satisfy validation.

      Build on impact.md: respect the answers the user gave to its questions and
      do not resolve its conflicts on your own. If a blocking question is still
      unanswered, ask before writing the proposal.

      Keep the change small and vertical. If it needs more than ~3 new
      requirements, or touches several unrelated capabilities, propose
      splitting it into several changes (one line each: kebab-case name + what
      it delivers) and continue with the first one only after the user agrees.

      Do not invent requirements. Only include what the user asked for; list
      gaps as questions.
    requires:
      - impact

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's "Funcionalidades" section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, compare the capabilities the proposal lists
        with the `specs/<capability-path>/spec.md` files that already exist,
        and start with the first capability that has no file. Do not rewrite
        an existing file unless the user asks you to.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it. Do not plan every file
        before writing the first.
      - Stop when every capability the proposal lists has its file.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Motivo** and **Migración** (Spanish labels)
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` flags longer descriptions in ADDED requirements and in the main spec. This is a warning: normal validation still passes, but `openspec validate --strict` fails on it. When writing a new requirement, state one behavior per requirement: move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep the existing requirement block whole; never split, trim or rewrite existing text just to meet the length. Split an existing long requirement only when the user asks for it, in a change made for that purpose: under MODIFIED, keep its header and every scenario and cut its description down to one behavior without changing its meaning, then add each behavior you removed as its own ADDED requirement with its own scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Language: the structural headings `## Purpose`, `## ADDED/MODIFIED/
      REMOVED/RENAMED Requirements`, `### Requirement:` and `#### Scenario:`,
      and the keywords SHALL/MUST and WHEN/THEN, MUST stay in English:
      OpenSpec finds requirements only through them, and a change with
      translated headings fails validation and cannot be archived. Everything
      else (title, requirement and scenario names, prose, labels) is Spanish.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Especificación (delta)

      ## Purpose

      Permite a los usuarios llevarse sus datos en un formato portable.

      ## ADDED Requirements

      ### Requirement: El usuario puede exportar sus datos
      El sistema SHALL permitir a los usuarios exportar sus datos en CSV.

      #### Scenario: Exportación correcta
      - **WHEN** el usuario pulsa "Exportar"
      - **THEN** el sistema descarga un CSV con todos sus datos

      ## REMOVED Requirements

      ### Requirement: Exportación antigua
      **Motivo**: sustituida por la nueva exportación
      **Migración**: usar la nueva exportación desde el perfil del usuario
      ```

      Specs should be testable - each scenario is a potential test case.

      Business rules, not implementation. Specs are the long-lived functional
      memory of the project and must survive a rewrite of the architecture:
      - Good: "A cancelled operation SHALL release its assigned resources."
      - Bad: "cancelOperation() calls resourceRepository.deleteAll()."

      Scenarios are the acceptance criteria the user approves before any code
      is written. Aim for 2-3 scenarios per requirement; if a requirement needs
      more, it probably holds several behaviors - split it.

      Approved rules are the contract. A spec never changes just because code
      behaves differently; a spec change is always a proposal the user approves.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.
      Always create it: tasks.md takes its granularity from the "Complejidad"
      section. For a simple change it may contain only Complejidad and a few
      Decisiones.

      **Complejidad** (first section) - decide the change's level and write it
      down. Estimate:
      - Lines of code created + modified + deleted (production and tests),
        based on the affected code in impact.md and the decisions below.
      - Business rules involved: requirements ADDED, MODIFIED or REMOVED in
        this change's specs, plus the existing rules listed in impact.md under
        "Reglas que deben seguir cumpliéndose".

      The level is the HIGHER of the two criteria:
      - **bajo**: up to ~80 lines and at most 2 rules.
      - **medio**: up to ~300 lines and at most 5 rules.
      - **alto**: anything above.
      Write the level, both estimates and one line explaining it. If the level
      is alto and the change could be split into independent changes, say so.

      Other sections (exact Spanish headings from the template):
      - **Contexto**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation and scope instead of restating them (e.g., "Ver proposal.md - Objetivos"). Objectives and non-objectives live in the proposal; do not add a goals section here.
      - **Decisiones**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Riesgos / Compromisos**: Known limitations, things that could go wrong. Format: [Riesgo] → Mitigación
      - **Plan de migración**: Steps to deploy, rollback strategy (only if applicable).
      - **Preguntas abiertas**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.

      The simplest thing that meets the specs. No abstractions, layers,
      configuration or patterns "for the future". If a pattern could help,
      mention it under Decisiones as a suggestion with its concrete signal in the
      current code (for example, something that already repeats); the user
      decides. Keep it short: every decision listed here is one the
      implementation is allowed to take without asking again, and any decision
      NOT listed here will stop implementation for the user to decide.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for "Preguntas abiertas". If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below for tracked tasks.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all.

      Guidelines:
      - Group related tracked tasks under ## numbered headings
      - Each tracked task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Track implementation and verification work that can be completed before
        archive. If the requested workflow includes archive or work that requires
        this change to be archived, preserve those steps as plain bullets in an
        optional `## Seguimiento del flujo` section at the end of tasks.md. These
        bullets are reference information outside tracked task progress.
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Each task group MUST land the tests and documentation its own work
        calls for. Do NOT collect testing or documentation into a final group -
        when a late group first exercises work from an early one, the failures
        cascade back through every group in between and force rework. A group
        whose work calls for neither, such as scaffolding or dependency setup,
        carries neither. A final group is for integration checks only, not for
        the tests and docs an earlier group owed.

      Task granularity follows the level in design.md "Complejidad". A
      simple change must not be broken into many tasks: implementation already
      stops after every TDD cycle (one test), so tasks only group cycles into
      reviewable units.
      - **bajo**: 1-2 tasks in total. One task may cover several scenarios and
        their tests, including the regression tests.
      - **medio**: one task per requirement (typically 3-6 tasks), each with
        the tests of its scenarios; regression tests go inside the task that
        touches that rule.
      - **alto**: one task per scenario (about one TDD cycle, roughly ≤50
        changed lines and ≤3 files), grouped under one ## heading per
        requirement; regression tests may be their own tasks. If this yields
        more than ~15 tasks, propose splitting the change instead.
      If design.md has no Complejidad section, stop and ask for it rather than
      guessing the granularity.

      Incremental implementation rules:
      - Each task is a vertical, verifiable behavior increment.
      - Each task names the spec scenario it covers, the test(s) that prove it
        (names only, no code) and WHERE they run (endpoint, service,
        component...). Prefer the highest practical level.
      - No standalone technical tasks ("create the database", "add the
        entity"): infrastructure is built inside the first behavior task that
        needs it.
      - Scenarios that cannot be tested well (for example, visual ones) get a
        task marked `(verificación manual)`.
      - Every rule listed under "Reglas que deben seguir cumpliéndose" in
        impact.md gets a regression task (or is cited by an existing task that
        already tests it).
      - Do not add tasks for behavior that is not in the specs.

      Example:
      ```
      # Tareas

      ## 1. Cancelar operación

      - [ ] 1.1 Cancelar una operación pendiente la deja en estado CANCELADA — escenario "Cancelación de operación pendiente"; test `cancela operación pendiente` (endpoint POST /operations/{id}/cancel)
      - [ ] 1.2 Cancelar libera los recursos asignados — escenario "Liberación de recursos"; test `libera recursos al cancelar` (servicio)
      - [ ] 1.3 Regresión: una operación finalizada no puede modificarse — regla de impact.md; test `rechaza cancelar operación finalizada` (endpoint)

      ## 2. Aviso al operador

      - [ ] 2.1 El panel muestra el aviso de cancelación (verificación manual)
      ```

      When applicable, append the workflow follow-up as plain bullets, for example:
      ```
      ## Seguimiento del flujo

      - Archivar el cambio cuando se cumplan los requisitos de revisión del proyecto.
      - Verificar el resultado archivado.
      ```

      Reference specs for what needs to be built, design for how to build it.

      Next step: this project implements with the `sdd-pair` skill, never with
      the apply workflow. When the planning artifacts are ready and you tell
      the user how to continue, name `/sdd-pair` (`$sdd-pair` in Codex; the
      `sdd-pair` skill in other agents) instead of `/opsx:apply`, `/opsx-apply`
      or `openspec-apply-change`.
    requires:
      - specs
      - design

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Supervised incremental implementation. Prefer the `sdd-pair` skill
    (`/sdd-pair`); if you are running another apply workflow, these rules
    still take precedence over "keep going through tasks":

    - Work on ONE pending task per run: the first unchecked one.
    - Before coding, list the tests for that task (names + where they run)
      and wait for the user's approval.
    - TDD cycle per test: write the test, run it and show it fails (red),
      write the minimum code to pass, run the tests and show they pass (green).
    - After one cycle, STOP and wait for the user. "Do N" means N complete
      cycles, never N tests first and then the code.
    - Mark the task `- [x]` only when all its tests are green.
    - Stop immediately if: a design decision is not covered by design.md;
      you want to add something not specified; a test would need to be changed,
      skipped or deleted to pass; two attempts failed to reach green; the step
      exceeds ~50 lines or 3 files (propose splitting the task); the code
      contradicts an approved spec.
    - Every function or method written or touched must have a cognitive
      complexity of 15 or less (SonarSource definition) whenever possible.
      Measure it with the project's analyzer when configured. If it ends up
      above 15, report it and propose a refactor (tests green, separate
      step); it stays above 15 only with the user's explicit approval.
    - Angular projects (IMPERATIVE): if the project is Angular and
      package.json declares both `test:server` and `karma:run`, start
      `npm run test:server` once as a background process and keep it running
      for the whole session. It never returns: never run it in the
      foreground or wait for it to finish. Start it early and keep working;
      check its log only right before the first karma:run, with short waits
      (~10 s, never long sleeps), until the initial full run finished
      ("Executed N of N" / "TOTAL:"). Never stop it or start a second one. In PowerShell,
      start it detached with
      `Start-Process -FilePath cmd.exe -ArgumentList "/c","npm run test:server > .test-server.log 2>&1" -WindowStyle Hidden`
      (not Start-Job) and call `npm.cmd` instead of `npm` so the `--`
      reaches karma:run. Then run
      only the needed tests by description with
      `npm run karma:run -- "<describe/it description>"` and read the result
      from that command's output. Never use `ng test` or `npm test` there.
    - Never paste code or tests into the conversation (no code blocks,
      diffs or excerpts): name the files written or changed as `path:line`
      so the user reviews them in the IDE.
    - Never edit specs to match the code. Never commit.
