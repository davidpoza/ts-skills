schema: sdd-incremental

context: |
  Idioma: Español
  Todos los artefactos (impact, proposal, specs, design, tasks) deben escribirse en español,
  con los encabezados en español que marca cada plantilla.
  Excepción: en las specs, mantén en inglés los encabezados que OpenSpec valida
  (## Purpose, ## ADDED/MODIFIED/REMOVED/RENAMED Requirements, ### Requirement:, #### Scenario:)
  y las palabras clave SHALL/MUST y WHEN/THEN.

  Implementación: este proyecto implementa siempre con el skill sdd-pair (/sdd-pair en Claude Code,
  $sdd-pair en Codex), nunca con /opsx:apply. Cuando un flujo indique el siguiente paso para
  implementar, nombra /sdd-pair en lugar de /opsx:apply.

  # Añade aquí solo restricciones que el agente no pueda deducir leyendo el código. Ejemplo:
  # Stack: Spring Boot (backend), Angular (frontend)
  # Tests: JUnit 5 + Spring Boot Test; Jasmine/Karma en el frontend

# Reglas por artefacto (opcional). Las reglas fuertes viven en el schema sdd-incremental;
# usa esto para matices del proyecto.
rules:
  specs:
    - Las specs describen reglas de negocio observables, nunca clases, métodos ni frameworks
  tasks:
    - Cada tarea es un incremento de comportamiento pequeño (un ciclo TDD), nunca una capa técnica

# Red de seguridad por si alguien usa /opsx:apply en lugar de /sdd-pair.
operations:
  apply:
    guidance:
      - Implement only ONE pending task per run, one TDD cycle at a time (red → minimum code → green), then stop and wait for approval
      - List the task's tests (names + where they run) and wait for approval before writing them
      - Stop before any design decision not covered by design.md or any behavior not in the specs
      - Never change, skip or delete a test to make it pass; never edit specs to match the code
      - Keep the cognitive complexity of every function written or touched at 15 or less whenever possible; if it ends up above 15, report it and propose a refactor before continuing
      - "IMPERATIVE in Angular projects whose package.json declares test:server and karma:run: start `npm run test:server` once in the background and keep it running; run only the needed tests with `npm run karma:run -- \"<test description>\"` and read the result from that command's output; never use ng test or npm test"
      - Never commit; suggest the commit message instead
